<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d4ed8, #0f172a 55%);
      color: #f8fafc;
    }
    main { text-align: center; padding: 2rem; }
    h1 { margin: 0; font-size: clamp(3rem, 12vw, 7rem); letter-spacing: -0.06em; }
    p { margin: 1rem 0 0; color: #cbd5e1; font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <p>Something fun is coming soon.</p>
  </main>

</html>
